[project]
name = "onveef"
dynamic = ["version"]
description = "A fast, zeep-free ONVIF client library for Python — IP cameras, NVRs and VMS (Profile S/T/G/M/A/C), sync and async."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "Akshat Pandey", email = "akshat16pandey@gmail.com" }]
keywords = [
    "onvif",
    "onvif-client",
    "ip-camera",
    "security-camera",
    "ptz",
    "rtsp",
    "snapshot",
    "soap",
    "vms",
    "cctv",
    "nvr",
    "video-surveillance",
    "ws-discovery",
    "profile-s",
    "profile-t",
    "profile-g",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Multimedia :: Video",
    "Topic :: System :: Networking",
    "Topic :: Home Automation",
    "Environment :: Console",
    "Operating System :: OS Independent",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.28",
    "defusedxml>=0.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5",
    "mypy>=1.13",
    "ruff>=0.15",
    "types-defusedxml>=0.7",
    "build>=1.2",
    "twine>=5.1",
    "commitizen>=4.17.0",
    "pre-commit>=3.8",
]
docs = [
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.26",
]

[project.scripts]
onveef = "onveef.cli:main"

[project.urls]
Homepage = "https://github.com/Akshat-Pandey16/onveef"
Documentation = "https://github.com/Akshat-Pandey16/onveef#readme"
Repository = "https://github.com/Akshat-Pandey16/onveef"
Issues = "https://github.com/Akshat-Pandey16/onveef/issues"
Changelog = "https://github.com/Akshat-Pandey16/onveef/blob/main/CHANGELOG.md"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/onveef/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/onveef"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RET", "PTH", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["onveef", "conftest"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--cov=onveef --cov-report=term-missing --cov-fail-under=80"

[tool.coverage.run]
branch = true
source = ["src/onveef"]

[tool.coverage.report]
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

[tool.commitizen]
name = "cz_conventional_commits"
version = "0.6.0"
tag_format = "v$version"
version_scheme = "pep440"
version_files = ["src/onveef/__init__.py:__version__"]
update_changelog_on_bump = true
changelog_incremental = true
major_version_zero = true
