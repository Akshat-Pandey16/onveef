site_name: onveef
site_description: A fast, zeep-free ONVIF client for IP cameras
repo_url: https://github.com/Akshat-Pandey16/onveef
repo_name: Akshat-Pandey16/onveef

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - search.suggest
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle: { icon: material/weather-night, name: Switch to dark mode }
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle: { icon: material/weather-sunny, name: Switch to light mode }

nav:
  - Home: index.md
  - CLI: cli.md
  - API reference:
      - Clients: api/clients.md
      - Sans-IO core: api/core.md
      - Discovery & helpers: api/helpers.md
  - Contributing: contributing.md
  - Publishing: publishing.md
  - Security: security.md
  - Changelog: changelog.md

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google
            show_source: false
            show_root_heading: true
            members_order: source
            separate_signature: true
            show_signature_annotations: true
            filters: ["!^_"]

markdown_extensions:
  - admonition
  - pymdownx.snippets:
      base_path: ["."]
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences
